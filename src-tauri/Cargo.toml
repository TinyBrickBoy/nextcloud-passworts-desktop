[package]
name = "nextcloud-passwords-desktop"
version = "0.1.0"
description = "Minimalistischer Desktop Client für Nextcloud Passwords"
edition = "2021"
license = "MIT"

[lib]
name = "ncpw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
thiserror = "2"
hex = "0.4"
base64 = "0.22"
sha1 = "0.10"
blake2 = "0.10"
argon2 = "0.5"
crypto_secretbox = "0.1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
arboard = { version = "3", features = ["wayland-data-control"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
