name: Release

# Wird ausgelöst, sobald auf GitHub ein Release veröffentlicht wird.
# Baut die Installer für Linux und Windows und hängt sie an diesen Release.
on:
  release:
    types: [published]

permissions:
  contents: write
  # Für GitHub Attestations (signierte Herkunftsnachweise der Installer)
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Beide auf frischen GitHub Runnern, damit die Attestations nachweisen, dass die
          # Dateien auf einer leeren Maschine gebaut wurden. Linux auf der ältesten
          # unterstützten Ubuntu Version, damit das AppImage auch auf älteren Systemen läuft.
          - name: linux
            runner: ubuntu-22.04
          - name: windows
            runner: windows-latest
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xdg-utils file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Version aus dem Tag übernehmen
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Tauri braucht Semver (1.2.3). Kurze Tags wie v1.0 oder 2 werden mit .0 aufgefüllt.
          VERSION=$(node -e '
            const tag = process.argv[1].trim().replace(/^v/i, "");
            const m = tag.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?(-[0-9A-Za-z.-]+)?$/);
            if (!m) {
              console.error(`Tag "${process.argv[1]}" ist keine Version. Beispiel: v1.0.0 oder 1.0`);
              process.exit(1);
            }
            console.log(`${m[1]}.${m[2] ?? 0}.${m[3] ?? 0}${m[4] ?? ""}`);
          ' "$TAG")
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          ' "$VERSION"
          echo "Tag: $TAG → Version: $VERSION"

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy ohne FUSE ausführen
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          releaseId: ${{ github.event.release.id }}
          uploadUpdaterJson: false

      # Prüfbar mit: gh attestation verify <Datei> -R TinyBrickBoy/nextcloud-passworts-desktop
      - name: Attestation (Linux)
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Attestation (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
